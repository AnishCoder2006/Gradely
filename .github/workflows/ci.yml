name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MONGOMS_PREFER_GLOBAL_PATH: '1'

jobs:
  validate:
    name: Validate frontend and backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            student-record-management/package-lock.json
            student-record-backend/package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            student-record-management/node_modules
            student-record-backend/node_modules
          key: ${{ runner.os }}-node22-node-modules-${{ hashFiles('student-record-management/package-lock.json', 'student-record-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-node-modules-

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-memory-server-${{ hashFiles('student-record-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-memory-server-

      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: student-record-management
        run: npm ci

      - name: Install backend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: student-record-backend
        run: npm ci

      - name: Type-check frontend
        working-directory: student-record-management
        run: npm run type-check

      - name: Type-check backend
        working-directory: student-record-backend
        run: npm run type-check

      - name: Lint frontend
        working-directory: student-record-management
        run: npm run lint

      - name: Lint backend
        working-directory: student-record-backend
        run: npm run lint

      - name: Test backend
        working-directory: student-record-backend
        run: npx vitest run

      - name: Build frontend
        working-directory: student-record-management
        run: npm run build

      - name: Build backend
        working-directory: student-record-backend
        run: npm run build
