<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Student Record Management — academic data, grades, and attendance in one place." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Typography is loaded by the shared stylesheet. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <title>Student Records</title>

  <!-- Block FOUC: read theme from localStorage before React mounts -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (prefersDark ? 'dark' : 'light');

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.style.setProperty('color-scheme', theme);
      } catch (e) { }
    })();
  </script>

  <style>
    /* Prevent white flash before React + CSS variables load */
    html {
      background-color: var(--bg-base);
      font-family: 'Instrument Sans', sans-serif;
    }

    html.dark {
      background-color: var(--bg-base);
    }

    /* Hide root until hydrated — prevents unstyled content flash */
    #root:empty {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
